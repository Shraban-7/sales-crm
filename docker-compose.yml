services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sale-fusion-crm-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm_network

  nginx:
    image: nginx:1.27-alpine
    container_name: sale-fusion-crm-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - crm_network

  db:
    image: mysql:8.0
    container_name: sale-fusion-crm-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-sales_crm}"
      MYSQL_USER: "${DB_USERNAME:-crm_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - crm_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  crm_mysql_data:
