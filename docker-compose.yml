services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sale-fusion-crm-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-sales_crm}"
      DB_USERNAME: "${DB_USERNAME:-crm_user}"
      DB_PASSWORD: "${DB_PASSWORD:-crm_secret_password}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm_network

  nginx:
    image: nginx:1.27-alpine
    container_name: sale-fusion-crm-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - crm_network

  db:
    image: mysql:8.0
    container_name: sale-fusion-crm-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-sales_crm}"
      MYSQL_USER: "${DB_USERNAME:-crm_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-crm_secret_password}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-crm_root_password}"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - crm_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm_network

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sale-fusion-crm-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-sales_crm}"
      DB_USERNAME: "${DB_USERNAME:-crm_user}"
      DB_PASSWORD: "${DB_PASSWORD:-crm_secret_password}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
    depends_on:
      db:
        condition: service_healthy
    command: php artisan queue:work database --sleep=3 --tries=3 --max-time=3600
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  crm_mysql_data:
